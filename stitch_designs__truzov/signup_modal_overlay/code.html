</div>
</div>

<input class="w-full border border-neutral-mid-gray rounded-lg px-md py-2.5 focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-all font-body-md" placeholder="name@company.com" type="text">

</div>
<div class="flex-1 flex flex-col space-y-xs">

</div>
</div>

<div class="h-1 flex-grow bg-primary rounded-full"></div>
<div class="h-1 flex-grow bg-primary rounded-full"></div>
<div class="h-1 flex-grow bg-primary rounded-full"></div>
