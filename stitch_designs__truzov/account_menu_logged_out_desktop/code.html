        body { font-family: 'Inter', sans-serif; background-color: rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }

<body class="bg-neutral-dark-gray/50">
<!-- Account Popup Modal -->
<div class="bg-neutral-white w-[320px] rounded-lg shadow-xl border border-neutral-mid-gray flex flex-col overflow-hidden relative">
<!-- Header -->
<div class="px-md py-md border-b border-neutral-light-gray flex items-center justify-between bg-surface-container-lowest">
<span class="font-h5-bold text-h5-bold text-on-surface">Account</span>
<button class="text-on-surface-variant hover:text-primary transition-colors focus:outline-none">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">close</span>
</button>
</div>
<!-- Content Body -->
<div class="px-md py-lg flex flex-col items-center text-center">
<div class="w-xl h-xl bg-surface-container-high rounded-full flex items-center justify-center mb-md">
<span class="material-symbols-outlined text-primary text-[32px]" style="font-variation-settings: 'FILL' 0;">shield_person</span>
</div>
<h2 class="font-h4 text-h4 text-on-surface mb-sm">Welcome to TRUZOV</h2>
<p class="font-body-md text-body-md text-on-surface-variant mb-lg">Access your verified health dashboard.</p>
<!-- Actions -->
<div class="w-full flex flex-col gap-sm">
<button class="w-full bg-primary-container text-on-primary font-h6-bold text-h6-bold py-sm px-md rounded transition-colors hover:bg-primary active:scale-[0.98]">
                    Login
                </button>
<button class="w-full border border-primary-container text-primary-container font-h6-bold text-h6-bold py-sm px-md rounded transition-colors hover:bg-surface-container-low active:scale-[0.98]">
                    Sign Up / Create Account
                </button>
</div>
</div>
<!-- Footer Links -->
<div class="px-md py-sm bg-neutral-light-gray border-t border-neutral-mid-gray flex justify-center gap-md">
<a class="font-label-sm text-label-sm text-on-surface-variant hover:text-primary hover:underline transition-colors flex items-center gap-xs" href="#">
<span class="material-symbols-outlined text-[16px]" style="font-variation-settings: 'FILL' 0;">verified</span>
                Why Verified?
            </a>


</div>
</div>
