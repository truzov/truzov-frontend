        .toggle-label {

            border-radius: 9999px;
            position: relative;
            cursor: pointer;
            transition: background-color 0.2s ease-in-out;
        }
        .toggle-label:after {
            content: '';
            position: absolute;
            top: 2px;
            left: 2px;
            width: 20px;
            height: 20px;
            background-color: white;
            border-radius: 50%;
            transition: transform 0.2s ease-in-out;

<script>
        // Simple script to handle tab switching
        document.addEventListener('DOMContentLoaded', () => {
            const tabs = document.querySelectorAll('aside nav button');
            const panels = document.querySelectorAll('.filter-panel');

            tabs.forEach(tab => {
                tab.addEventListener('click', () => {
                    // Reset all tabs
                    tabs.forEach(t => {
                        t.classList.remove('bg-surface-container-lowest', 'font-h6-bold', 'text-h6-bold', 'text-primary', 'border-primary');
                        t.classList.add('font-body-md', 'text-body-md', 'text-on-surface-variant', 'border-transparent');
                    });

                    // Set active tab
                    tab.classList.remove('font-body-md', 'text-body-md', 'text-on-surface-variant', 'border-transparent');
                    tab.classList.add('bg-surface-container-lowest', 'font-h6-bold', 'text-h6-bold', 'text-primary', 'border-primary');

                    // Hide all panels
                    panels.forEach(p => p.classList.add('hidden'));

                    // Show target panel
                    const targetId = tab.getAttribute('data-target');
                    const targetPanel = document.getElementById(targetId);
                    if(targetPanel) {
                        targetPanel.classList.remove('hidden');
                    } else {
                        // If panel not mocked, just show a placeholder or keep current hidden
                        // For demonstration, we just log it if we didn't build that specific panel
                        console.log('Panel not mocked:', targetId);
                    }
                });
            });
        });
    </script>
