<script>
        function togglePw() {
            const input = document.getElementById('pw');
            input.type = input.type === 'password' ? 'text' : 'password';
        }

        // Simple interaction for the strength bar
        const pwInput = document.getElementById('pw');
        const strengthBar = document.getElementById('pw-strength');
        pwInput.addEventListener('input', (e) => {
            const val = e.target.value;
            if(val.length === 0) strengthBar.style.width = '0%';
            else if(val.length < 5) {
                strengthBar.style.width = '30%';
                strengthBar.className = 'h-full bg-error transition-all duration-500';
            }
            else if(val.length < 10) {
                strengthBar.style.width = '60%';
                strengthBar.className = 'h-full bg-warning transition-all duration-500';
            }
            else {
                strengthBar.style.width = '100%';
                strengthBar.className = 'h-full bg-success transition-all duration-500';
            }
        });
    </script>
