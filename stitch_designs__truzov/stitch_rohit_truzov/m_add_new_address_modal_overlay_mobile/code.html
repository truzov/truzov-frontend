<!DOCTYPE html><html lang="en"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>Add Address Modal - Truzov</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<script id="tailwind-config">
        tailwind.config = {
          darkMode: "class",
          theme: {
            extend: {
              "colors": {
                      "surface-bright": "#f6fbef",
                      "success": "#218838",
                      "primary-fixed": "#9cf88d",
                      "on-primary": "#ffffff",
                      "on-tertiary-fixed-variant": "#841a4f",
                      "surface-container-low": "#f0f5e9",
                      "neutral-light-gray": "#F0F0F0",
                      "neutral-white": "#FFFFFF",
                      "inverse-surface": "#2c322a",
                      "secondary-fixed-dim": "#cec5b8",
                      "tertiary-container": "#b24073",
                      "on-secondary-fixed-variant": "#4c463c",
                      "tertiary-fixed-dim": "#ffb0cc",
                      "error": "#C82333",
                      "surface-variant": "#dfe4d8",
                      "primary": "#00600a",
                      "on-tertiary": "#ffffff",
                      "on-primary-fixed": "#002201",
                      "surface-container-lowest": "#ffffff",
                      "surface-dim": "#d6dcd0",
                      "on-primary-container": "#adff9d",
                      "tertiary": "#93275a",
                      "surface-tint": "#0d6e13",
                      "surface-container-highest": "#dfe4d8",
                      "on-secondary-container": "#6a6459",
                      "neutral-dark-gray": "#333333",
                      "secondary": "#645e53",
                      "inverse-on-surface": "#edf3e6",
                      "on-error": "#ffffff",
                      "on-surface": "#181d16",
                      "on-secondary": "#ffffff",
                      "secondary-fixed": "#ebe1d3",
                      "on-error-container": "#93000a",
                      "surface-container": "#eaf0e4",
                      "neutral-mid-gray": "#CCCCCC",
                      "on-tertiary-fixed": "#3e0020",
                      "outline": "#707a6b",
                      "on-background": "#181d16",
                      "accent-link": "#477DCA",
                      "surface-container-high": "#e5eade",
                      "surface": "#f6fbef",
                      "primary-container": "#1f7a1f",
                      "background": "#f6fbef",
                      "primary-fixed-dim": "#81db74",
                      "on-secondary-fixed": "#1f1b13",
                      "error-container": "#ffdad6",
                      "warning": "#E0A800",
                      "on-tertiary-container": "#ffe5eb",
                      "inverse-primary": "#81db74",
                      "outline-variant": "#bfcab8",
                      "on-primary-fixed-variant": "#005308",
                      "secondary-container": "#ebe1d3",
                      "on-surface-variant": "#404a3c",
                      "tertiary-fixed": "#ffd9e4"
              },
              "borderRadius": {
                      "DEFAULT": "0.125rem",
                      "lg": "0.25rem",
                      "xl": "0.5rem",
                      "full": "0.75rem"
              },
              "spacing": {
                      "lg": "24px",
                      "xs": "4px",
                      "xxl": "64px",
                      "xl": "32px",
                      "md": "16px",
                      "gutter": "24px",
                      "sm": "8px",
                      "margin": "20px",
                      "base": "4px"
              },
              "fontFamily": {
                      "caption": ["Inter"],
                      "body-md": ["Inter"],
                      "label-sm": ["Inter"],
                      "h4": ["Inter"],
                      "h1": ["Inter"],
                      "h2": ["Inter"],
                      "h6-bold": ["Inter"],
                      "h3": ["Inter"],
                      "h5-bold": ["Inter"]
              },
              "fontSize": {
                      "caption": ["12px", { "lineHeight": "1.4", "fontWeight": "400" }],
                      "body-md": ["16px", { "lineHeight": "1.5", "fontWeight": "400" }],
                      "label-sm": ["12px", { "lineHeight": "1.2", "letterSpacing": "0.02em", "fontWeight": "600" }],
                      "h4": ["18px", { "lineHeight": "1.4", "fontWeight": "600" }],
                      "h1": ["32px", { "lineHeight": "1.2", "fontWeight": "700" }],
                      "h2": ["24px", { "lineHeight": "1.3", "fontWeight": "600" }],
                      "h6-bold": ["14px", { "lineHeight": "1.5", "fontWeight": "700" }],
                      "h3": ["20px", { "lineHeight": "1.4", "fontWeight": "600" }],
                      "h5-bold": ["16px", { "lineHeight": "1.5", "fontWeight": "700" }]
              }
            }
          }
        }
    </script>
<style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-surface-bright text-on-surface antialiased h-screen w-full relative overflow-hidden flex items-center justify-center">
<!-- Mock Background Content to show overlay effect -->
<div class="absolute inset-0 z-0 p-margin bg-background opacity-30 pointer-events-none">
<div class="h-12 w-3/4 bg-surface-variant rounded mb-8"></div>
<div class="h-32 w-full bg-surface-variant rounded mb-8"></div>
<div class="h-32 w-full bg-surface-variant rounded mb-8"></div>
</div>
<!-- Modal Backdrop -->
<div aria-hidden="true" class="fixed inset-0 bg-neutral-dark-gray/50 z-40 transition-opacity duration-300"></div>
<!-- Modal Container -->
<div class="fixed inset-0 z-50 flex items-end sm:items-center justify-center p-4 sm:p-0">
<!-- Modal Card -->
<div class="bg-surface-container-lowest rounded-t-xl sm:rounded-xl w-full max-w-lg overflow-hidden shadow-xl transform transition-all flex flex-col max-h-[795px]">
<!-- Header -->
<div class="flex items-center justify-between px-md py-md border-b border-neutral-mid-gray bg-surface-bright sticky top-0 z-10">
<h2 class="font-h3 text-h3 text-on-surface">Add New Address</h2>
<button aria-label="Close modal" class="text-on-surface-variant hover:text-on-surface transition-colors" type="button">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">close</span>
</button>
</div>
<!-- Scrollable Content Area -->
<div class="px-md py-lg overflow-y-auto flex-1 bg-surface-container-lowest">
<form class="space-y-md" id="add-address-form">
<!-- Contact Information Section -->
<div class="space-y-md">
<h3 class="font-h6-bold text-h6-bold text-primary mb-sm">Contact Details</h3>
<!-- Name Field -->
<div class="flex flex-col">
<label class="font-label-sm text-label-sm text-on-surface-variant mb-xs" for="fullName">Full Name</label>
<input class="w-full px-sm py-sm border border-neutral-mid-gray rounded bg-surface-container-lowest text-body-md font-body-md text-on-surface focus:outline-none focus:ring-1 focus:ring-primary focus:border-primary transition-colors" id="fullName" name="fullName" placeholder="e.g. Jane Doe" required="" type="text">
</div>
<!-- Mobile Field -->
<div class="flex flex-col">
<label class="font-label-sm text-label-sm text-on-surface-variant mb-xs" for="mobileNumber">Mobile Number</label>
<div class="relative">
<span class="absolute inset-y-0 left-0 flex items-center pl-sm text-on-surface-variant font-body-md">+1</span>
<input class="w-full pl-xl pr-sm py-sm border border-neutral-mid-gray rounded bg-surface-container-lowest text-body-md font-body-md text-on-surface focus:outline-none focus:ring-1 focus:ring-primary focus:border-primary transition-colors" id="mobileNumber" name="mobileNumber" pattern="[0-9]{10}" placeholder="10-digit number" required="" type="tel">
</div>
</div>
</div>
<div class="w-full h-px bg-neutral-mid-gray my-md"></div>
<!-- Address Information Section -->
<div class="space-y-md">
<h3 class="font-h6-bold text-h6-bold text-primary mb-sm">Location Details</h3>
<!-- Pincode/Zipcode Field -->
<div class="flex flex-col">
<label class="font-label-sm text-label-sm text-on-surface-variant mb-xs" for="pincode">Pincode</label>
<input class="w-full px-sm py-sm border border-neutral-mid-gray rounded bg-surface-container-lowest text-body-md font-body-md text-on-surface focus:outline-none focus:ring-1 focus:ring-primary focus:border-primary transition-colors" id="pincode" name="pincode" placeholder="6 digits [0-9] PIN code" required="" type="text">
</div>
<!-- Address Field -->
<div class="flex flex-col">
<label class="font-label-sm text-label-sm text-on-surface-variant mb-xs" for="addressLine1">Address (House No, Building, Street, Area)</label>
<textarea class="w-full px-sm py-sm border border-neutral-mid-gray rounded bg-surface-container-lowest text-body-md font-body-md text-on-surface focus:outline-none focus:ring-1 focus:ring-primary focus:border-primary transition-colors resize-none" id="addressLine1" name="addressLine1" placeholder="Enter full address..." required="" rows="2"></textarea>
</div>
<!-- Locality / Town -->
<div class="flex flex-col">
<label class="font-label-sm text-label-sm text-on-surface-variant mb-xs" for="locality">Locality / Town</label>
<input class="w-full px-sm py-sm border border-neutral-mid-gray rounded bg-surface-container-lowest text-body-md font-body-md text-on-surface focus:outline-none focus:ring-1 focus:ring-primary focus:border-primary transition-colors" id="locality" name="locality" placeholder="e.g. Downtown" required="" type="text">
</div>
<!-- City & State Grid -->
<div class="grid grid-cols-2 gap-md">
<!-- City -->
<div class="flex flex-col">
<label class="font-label-sm text-label-sm text-on-surface-variant mb-xs" for="city">City / District</label>
<input class="w-full px-sm py-sm border border-neutral-mid-gray rounded bg-surface-container-lowest text-body-md font-body-md text-on-surface focus:outline-none focus:ring-1 focus:ring-primary focus:border-primary transition-colors bg-surface-container-low" id="city" name="city" placeholder="Auto-filled" readonly="" required="" type="text">
</div>
<!-- State -->
<div class="flex flex-col">
<label class="font-label-sm text-label-sm text-on-surface-variant mb-xs" for="state">State</label>
<input class="w-full px-sm py-sm border border-neutral-mid-gray rounded bg-surface-container-lowest text-body-md font-body-md text-on-surface focus:outline-none focus:ring-1 focus:ring-primary focus:border-primary transition-colors bg-surface-container-low" id="state" name="state" placeholder="Auto-filled" readonly="" required="" type="text">
</div>
</div>
</div>
</form>
</div>
<!-- Footer / Action Area -->
<div class="p-md border-t border-neutral-mid-gray bg-surface-container-lowest sticky bottom-0 z-10 pb-safe">
<button class="w-full bg-primary-container text-on-primary font-h5-bold text-h5-bold py-[12px] px-md rounded flex items-center justify-center gap-sm hover:bg-primary transition-colors active:scale-[0.98]" form="add-address-form" type="submit">
                    Save Address
                </button>
</div>
</div>
</div>
<script>
        // Simple mock interaction for pincode to auto-fill city/state for clinical feel
        document.getElementById('pincode').addEventListener('input', function(e) {
            const val = e.target.value;
            if(val.length >= 5) {
                document.getElementById('city').value = 'Metropolis';
                document.getElementById('state').value = 'New York';
            } else {
                document.getElementById('city').value = '';
                document.getElementById('state').value = '';
            }
        });
    </script>
</body></html>
